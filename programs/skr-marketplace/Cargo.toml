[package]
name = "skr-marketplace"
version = "0.1.0"
description = "SKR marketplace: NFTs + cNFTs listings and auctions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "skr_marketplace"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["associated_token", "token"] }
mpl-bubblegum = "2.1.1"

# Pin in case transitive deps require edition2024
rmp-serde = "=1.3.0"
rmp = "=0.8.14"
